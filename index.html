<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>For You 💛</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* Button */
#startBtn {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
}

/* Card */
.card {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    max-width: 350px;
}

/* Text */
#text {
    font-size: 18px;
    color: #333;
    white-space: pre-line;
}

/* Hearts */
.heart {
    position: absolute;
    animation: float 5s linear infinite;
}

@keyframes float {
    0% {transform: translateY(100vh);}
    100% {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<button id="startBtn">Click Me 💛</button>

<!-- Darkhaast song (YouTube embed hidden) -->
<iframe id="music" width="0" height="0" 
src="https://www.youtube.com/embed/VdyBtGaspss?enablejsapi=1">
</iframe>

<div class="card" id="card">
    <h2>Sorry 💛</h2>
    <p id="text"></p>
</div>

<script>

const message = `Sorry kal ghumiye porechilam or jonno 😞..
Pls maf kore dis 🙏🏼...
Khub tired lagchilo or jonno mone hoi ghum peyegachilo ...
Ami nijei jani nah khokon ghumiye porechilam...`;

let i = 0;
function typeWriter() {
    if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    }
}

document.getElementById("startBtn").onclick = function() {
    this.style.display = "none";
    document.getElementById("card").style.display = "block";
    typeWriter();

    // play music
    document.getElementById("music").src += "&autoplay=1";
};

// floating hearts
setInterval(() => {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}, 500);

</script>

</body>
</html>
