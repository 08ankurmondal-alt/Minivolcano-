<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>For You 💛</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* Button */
#startBtn {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

#startBtn:hover {
    transform: scale(1.1);
}

/* Card */
.card {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 350px;
}

/* Typing effect */
#text {
    font-size: 18px;
    color: #333;
    white-space: pre-line;
}

/* Hearts */
.heart {
    position: absolute;
    color: red;
    animation: float 5s linear infinite;
}

@keyframes float {
    0% {transform: translateY(100vh);}
    100% {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<button id="startBtn">Click Me 💛</button>

<div class="card" id="card">
    <h2>Sorry 💛</h2>
    <p id="text"></p>
</div>

<script>

// Your message
const message = `Sorry kal ghumiye porechilam or jonno 😞..
Pls maf kore dis 🙏🏼...
Khub tired lagchilo or jonno mone hoi ghum peyegachilo ...
Ami nijei jani nah khokon ghumiye porechilam...`;

// Typing effect
let i = 0;
function typeWriter() {
    if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    }
}

// Button click
document.getElementById("startBtn").onclick = function() {
    this.style.display = "none";
    document.getElementById("card").style.display = "block";
    typeWriter();
};

// Floating hearts
setInterval(() => {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}, 500);

</script>

</body>
</html>
