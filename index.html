<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমি দুঃখিত</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Noto Sans Bengali', sans-serif;
    background: linear-gradient(to right, #6a85b6, #bac8e0);
    overflow: hidden;
}

/* Floating Sorry */
.floating {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }
    to {
        transform: translateY(-10vh);
        opacity: 1;
    }
}

/* Center Card */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 380px;
}

h1 {
    color: #4a5d9f;
}

p {
    color: #555;
    font-size: 18px;
}
</style>

</head>

<body>

<!-- Floating texts -->
<script>
for(let i=0; i<20; i++){
    let span = document.createElement("span");
    span.className = "floating";
    span.innerText = "দুঃখিত";

    span.style.left = Math.random() * 100 + "vw";
    span.style.animationDuration = (5 + Math.random() * 5) + "s";
    span.style.fontSize = (16 + Math.random() * 20) + "px";

    document.body.appendChild(span);
}
</script>

<!-- Center Message -->
<div class="container">
    <div class="card">
        <h1>আমি সত্যিই দুঃখিত 💫</h1>
        <p>
            আমি তোমাকে কষ্ট দিতে চাইনি...  
            তুমি আমার কাছে খুবই স্পেশাল 🥺  
            দয়া করে আমাকে ক্ষমা করে দাও... 💫
        </p>
    </div>
</div>

</body>
</html>
