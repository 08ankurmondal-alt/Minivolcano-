<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>For Someone Special 💛</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #141e30, #243b55);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: white;
}

/* Button */
#startBtn {
    padding: 15px 30px;
    font-size: 22px;
    border: none;
    border-radius: 40px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 20px #ff4d6d;
    transition: 0.3s;
}

#startBtn:hover {
    transform: scale(1.1);
}

/* Card */
.card {
    display: none;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    max-width: 350px;
    box-shadow: 0 0 30px rgba(255,255,255,0.2);
}

/* Name glow */
.name {
    font-size: 24px;
    color: #ffccd5;
    text-shadow: 0 0 10px #ff4d6d, 0 0 20px #ff4d6d;
}

/* Typing text */
#text {
    font-size: 18px;
    white-space: pre-line;
    margin-top: 10px;
}

/* Floating hearts */
.heart {
    position: absolute;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {transform: translateY(100vh); opacity:1;}
    100% {transform: translateY(-10vh); opacity:0;}
}
</style>
</head>

<body>

<button id="startBtn">Click Me 💛</button>

<!-- Music -->
<iframe id="music" width="0" height="0"
src="https://www.youtube.com/embed/sK7riqg2mr4?enablejsapi=1">
</iframe>

<div class="card" id="card">
    <div class="name">For Best Friend</div>
    <h2>Sorry 💛</h2>
    <p id="text"></p>
</div>

<script>

// ✨ YOUR MESSAGE
const message = `Sorry kal ghumiye porechilam or jonno 😞..
Pls maf kore dis 🙏🏼...
Khub tired lagchilo or jonno mone hoi ghum peyegachilo ...
Ami nijei jani nah khokon ghumiye porechilam...

But honestly...
Torar sathe kotha bola amar onek bhalo lage 💛`;

// Typing effect
let i = 0;
function typeWriter() {
    if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 35);
    }
}

// Button click
document.getElementById("startBtn").onclick = function() {
    this.style.display = "none";
    document.getElementById("card").style.display = "block";
    typeWriter();

    // Play music
    document.getElementById("music").src += "&autoplay=1";
};

// Floating hearts
setInterval(() => {
    let heart = document.createElement("div");
    heart.innerHTML = "🌻🌻";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 400);

</script>

</body>
</html>
