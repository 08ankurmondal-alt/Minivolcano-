<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>For You 💛</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* Button Style */
#startBtn {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
}

#startBtn:hover {
    transform: scale(1.1);
}

/* Card hidden first */
.card {
    display: none;
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 350px;
    animation: fadeIn 1.5s ease-in-out;
}

h1 {
    color: #ff4d6d;
}

p {
    font-size: 18px;
    color: #333;
}

.heart {
    font-size: 30px;
    animation: beat 1s infinite;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(50px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes beat {
    0%, 100% {transform: scale(1);}
    50% {transform: scale(1.2);}
}
</style>
</head>

<body>

<button id="startBtn">Click Me 💛</button>

<div class="card" id="card">
    <h1>Sorry 💛</h1>
    <p>
        কালকে কথা বলতে বলতে আমি ঘুমিয়ে পড়েছিলাম… 😔<br><br>
        এটা ইচ্ছে করে করিনি… সত্যি বলছি, তোমার সাথে কথা বলতে আমার খুব ভালো লাগে।<br><br>
        তোমাকে না জানিয়ে এভাবে চলে যাওয়া ঠিক হয়নি…<br><br>
        তাই একটা ছোট্ট sorry বললাম 💛<br><br>
        আজ আমি পুরো জেগে আছি… আবার কথা বলবো? 😊
    </p>
    <div class="heart">💖</div>
</div>

<script>
document.getElementById("startBtn").onclick = function() {
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("card").style.display = "block";
};
</script>

</body>
</html>
